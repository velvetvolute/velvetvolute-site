[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Send velvetvolute.com (typo / brand-protection domain) to the real site
[[redirects]]
  from = "https://velvetvolute.com/*"
  to = "https://velvetvolute.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://velvetvolute.com/*"
  to = "https://velvetvolute.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.velvetvolute.com/*"
  to = "https://velvetvolute.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.velvetvolute.com/*"
  to = "https://velvetvolute.ca/:splat"
  status = 301
  force = true

# Keep design tools and notes in the project but off the live site
[[redirects]]
  from = "/.claude/*"
  to = "/not-found"
  status = 404
  force = true

[[redirects]]
  from = "/design-system/*"
  to = "/not-found"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/not-found"
  status = 404
  force = true
