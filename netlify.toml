[build]
  publish = "."
  command = "node build.mjs"

[functions]
  directory = "netlify/functions"

# Scheduled functions (cron, UTC). enjoy-followup keeps its schedule in its own file (daily 14:00 UTC).
[functions."cart-reminders"]
  schedule = "0 * * * *"      # hourly: one "You left these in your cart" email per saved cart 60–180 min old
[functions."drip"]
  schedule = "30 * * * *"     # hourly: welcome series (#1, day 3, day 7), 21-day "loved the 2 ml?", expired-code sweep

# Email + loyalty pages (static files; Netlify's pretty URLs also serve them without .html)
[[redirects]]
  from = "/subscribe"
  to = "/subscribe.html"
  status = 200
# The Real Ones stamp card lives at velvetvolute.ca/rewards ("Rewards" in the side menu)
[[redirects]]
  from = "/rewards"
  to = "/rewards.html"
  status = 200
# Old address (already in sent emails, incl. ?claim= links): forward to /rewards, query string kept
[[redirects]]
  from = "/the-real-ones"
  to = "/rewards"
  status = 301
[[redirects]]
  from = "/the-real-ones.html"
  to = "/rewards"
  status = 301
# Link page the business-card QR code opens (velvetvolute.ca/card)
[[redirects]]
  from = "/card"
  to = "/card.html"
  status = 200

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# sitemap.xml is written by build.mjs into the publish folder at deploy time (robots.txt points to it); serve both as what they are
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Meta Commerce Manager pulls this product feed (written by build.mjs) on a daily schedule
[[headers]]
  for = "/meta-catalog.csv"
  [headers.values]
    Content-Type = "text/csv; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Send velvetvolute.com (typo / brand-protection domain) to the real site
[[redirects]]
  from = "https://velvetvolute.com/*"
  to = "https://velvetvolute.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://velvetvolute.com/*"
  to = "https://velvetvolute.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.velvetvolute.com/*"
  to = "https://velvetvolute.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.velvetvolute.com/*"
  to = "https://velvetvolute.ca/:splat"
  status = 301
  force = true

# Keep design tools and notes in the project but off the live site
[[redirects]]
  from = "/.claude/*"
  to = "/not-found"
  status = 404
  force = true

[[redirects]]
  from = "/design-system/*"
  to = "/not-found"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/not-found"
  status = 404
  force = true

# the Warm Collection became the Coffeehouse Collection
[[redirects]]
  from = "/collections/warm/*"
  to = "/collections/coffeehouse/"
  status = 301
[[redirects]]
  from = "/collections/warm"
  to = "/collections/coffeehouse/"
  status = 301
