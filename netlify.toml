[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Keep design tools and notes in the project but off the live site
[[redirects]]
  from = "/.claude/*"
  to = "/not-found"
  status = 404
  force = true

[[redirects]]
  from = "/design-system/*"
  to = "/not-found"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/not-found"
  status = 404
  force = true
